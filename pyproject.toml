[project]
name = "modelbehavior"
version = "0.1.0"
description = "Crowdsourced LLM behaviors from X, built from the Community Archive."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
mbr = "mbr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbr"]
